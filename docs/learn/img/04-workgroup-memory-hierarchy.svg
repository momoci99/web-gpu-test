<svg xmlns="http://www.w3.org/2000/svg" id="lc04-hier" viewBox="0 0 640 350" width="640" height="350" font-family="sans-serif" font-size="13" fill="none" stroke="currentColor" stroke-width="1.5" role="img" aria-labelledby="lc04-hier-t">
  <title id="lc04-hier-t">메모리 계층: 글로벌 메모리, 워크그룹 메모리, 레지스터</title>
  <style>#lc04-hier{color:#1f2328}@media (prefers-color-scheme:dark){#lc04-hier{color:#e6edf3}}#lc04-hier text{fill:currentColor;stroke:none}</style>
  <defs>
    <marker id="lc04-hier-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" stroke="none"/></marker>
  </defs>

  <!-- workgroup A -->
  <rect x="20" y="20" width="290" height="210" rx="8"/>
  <text x="32" y="42" font-weight="bold">워크그룹 (0, 0)</text>
  <rect x="36" y="56" width="258" height="46" rx="4" fill="currentColor" fill-opacity="0.12"/>
  <text x="48" y="76">var&lt;workgroup&gt; tileA, tileB</text>
  <text x="48" y="94" font-size="12">이 워크그룹의 스레드 256개가 공유</text>
  <g>
    <rect x="36" y="140" width="56" height="70" rx="4"/>
    <rect x="102" y="140" width="56" height="70" rx="4"/>
    <rect x="168" y="140" width="56" height="70" rx="4"/>
  </g>
  <g text-anchor="middle">
    <text x="64" y="162">스레드</text><text x="64" y="182">acc</text><text x="64" y="199" font-size="11">레지스터</text>
    <text x="130" y="162">스레드</text><text x="130" y="182">acc</text><text x="130" y="199" font-size="11">레지스터</text>
    <text x="196" y="162">스레드</text><text x="196" y="182">acc</text><text x="196" y="199" font-size="11">레지스터</text>
    <text x="266" y="180">… 256개</text>
  </g>
  <line x1="64" y1="102" x2="64" y2="138" marker-end="url(#lc04-hier-a)"/>
  <line x1="130" y1="102" x2="130" y2="138" marker-end="url(#lc04-hier-a)"/>
  <line x1="196" y1="102" x2="196" y2="138" marker-end="url(#lc04-hier-a)"/>

  <!-- workgroup B -->
  <rect x="330" y="20" width="290" height="210" rx="8"/>
  <text x="342" y="42" font-weight="bold">워크그룹 (1, 0)</text>
  <rect x="346" y="56" width="258" height="46" rx="4" fill="currentColor" fill-opacity="0.12"/>
  <text x="358" y="76">var&lt;workgroup&gt; tileA, tileB</text>
  <text x="358" y="94" font-size="12">별도 사본. 워크그룹 (0, 0)은 볼 수 없음</text>
  <g>
    <rect x="346" y="140" width="56" height="70" rx="4"/>
    <rect x="412" y="140" width="56" height="70" rx="4"/>
    <rect x="478" y="140" width="56" height="70" rx="4"/>
  </g>
  <g text-anchor="middle">
    <text x="374" y="162">스레드</text><text x="374" y="182">acc</text><text x="374" y="199" font-size="11">레지스터</text>
    <text x="440" y="162">스레드</text><text x="440" y="182">acc</text><text x="440" y="199" font-size="11">레지스터</text>
    <text x="506" y="162">스레드</text><text x="506" y="182">acc</text><text x="506" y="199" font-size="11">레지스터</text>
    <text x="576" y="180">… 256개</text>
  </g>
  <line x1="374" y1="102" x2="374" y2="138" marker-end="url(#lc04-hier-a)"/>
  <line x1="440" y1="102" x2="440" y2="138" marker-end="url(#lc04-hier-a)"/>
  <line x1="506" y1="102" x2="506" y2="138" marker-end="url(#lc04-hier-a)"/>

  <!-- global memory -->
  <line x1="165" y1="282" x2="165" y2="232" marker-end="url(#lc04-hier-a)"/>
  <line x1="475" y1="282" x2="475" y2="232" marker-end="url(#lc04-hier-a)"/>
  <text x="175" y="262" font-size="12">타일 로드</text>
  <text x="485" y="262" font-size="12">타일 로드</text>
  <rect x="20" y="284" width="600" height="56" rx="8" fill="currentColor" fill-opacity="0.05"/>
  <text x="32" y="307" font-weight="bold">글로벌 메모리: storage 버퍼 a, b, c</text>
  <text x="32" y="327" font-size="12">모든 워크그룹이 읽고 쓸 수 있음. 가장 크고 가장 느림</text>
</svg>
