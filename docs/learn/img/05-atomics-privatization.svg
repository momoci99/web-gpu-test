<svg xmlns="http://www.w3.org/2000/svg" id="lc05-priv" viewBox="0 0 640 340" width="640" height="340" font-family="sans-serif" font-size="13" fill="none" stroke="currentColor" stroke-width="1.5" role="img" aria-labelledby="lc05-priv-t">
  <title id="lc05-priv-t">gpu-privatized: 워크그룹 4096개가 타일 64개와 점 묶음 64개의 모든 조합을 맡고, 워크그룹 메모리에 센 뒤 글로벌로 합침</title>
  <style>#lc05-priv{color:#1f2328}@media (prefers-color-scheme:dark){#lc05-priv{color:#e6edf3}}#lc05-priv text{fill:currentColor;stroke:none}</style>
  <defs>
    <marker id="lc05-priv-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" stroke="none"/></marker>
  </defs>

  <!-- left: workgroup table (drawn 8x8 to stand for 64x64) -->
  <text x="20" y="26" font-weight="bold">워크그룹 4,096개 = 타일 64개 × slice 64개</text>
  <g stroke-width="0.6" stroke-opacity="0.5">
    <path d="M60 70 H260 M60 95 H260 M60 120 H260 M60 145 H260 M60 170 H260 M60 195 H260 M60 220 H260 M60 245 H260 M60 270 H260"/>
    <path d="M60 70 V270 M85 70 V270 M110 70 V270 M135 70 V270 M160 70 V270 M185 70 V270 M210 70 V270 M235 70 V270 M260 70 V270"/>
  </g>
  <rect x="60" y="70" width="200" height="200"/>
  <rect x="110" y="70" width="25" height="200" fill="currentColor" fill-opacity="0.2" stroke-width="1"/>
  <rect x="110" y="145" width="25" height="25" fill="currentColor" fill-opacity="0.7" stroke-width="2"/>
  <text x="160" y="60" font-size="12" text-anchor="middle">slice (점 묶음) →</text>
  <text x="42" y="170" font-size="12" text-anchor="middle" transform="rotate(-90 42 170)">타일 (64×64 칸)</text>
  <text x="20" y="296" font-size="12">세로 한 줄: 같은 slice를 타일 64개가 모두 읽습니다.</text>
  <text x="20" y="314" font-size="12">그래서 점 하나를 64번 읽습니다.</text>
  <line x1="137" y1="157" x2="350" y2="62" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- right: what one workgroup does -->
  <g font-size="12">
    <rect x="355" y="40" width="270" height="40" rx="4"/>
    <text x="367" y="65">1. 내 slice의 점 p를 읽고 칸을 계산</text>
    <rect x="355" y="100" width="270" height="40" rx="4"/>
    <text x="367" y="125">2. 내 타일 밖이면 건너뜀</text>
    <rect x="355" y="160" width="270" height="44" rx="4" fill="currentColor" fill-opacity="0.12"/>
    <text x="367" y="178">3. atomicAdd(&amp;local[...], 1u)</text>
    <text x="367" y="195">워크그룹 메모리 4,096칸 = 16 KiB</text>
    <rect x="355" y="224" width="270" height="32" rx="4" stroke-dasharray="5 3"/>
    <text x="367" y="245">4. workgroupBarrier()</text>
    <rect x="355" y="276" width="270" height="44" rx="4" fill="currentColor" fill-opacity="0.05"/>
    <text x="367" y="294">5. 0이 아닌 칸만 bins에 atomicAdd</text>
    <text x="367" y="311">글로벌 메모리, 워크그룹마다 칸당 1번</text>
  </g>
  <g marker-end="url(#lc05-priv-a)">
    <line x1="490" y1="80" x2="490" y2="98"/><line x1="490" y1="140" x2="490" y2="158"/>
    <line x1="490" y1="204" x2="490" y2="222"/><line x1="490" y1="256" x2="490" y2="274"/>
  </g>
</svg>
