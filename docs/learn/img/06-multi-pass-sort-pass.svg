<svg xmlns="http://www.w3.org/2000/svg" id="lc06-pass" viewBox="0 0 680 420" width="680" height="420" font-family="sans-serif" font-size="13" fill="none" stroke="currentColor" stroke-width="1.5" role="img" aria-labelledby="lc06-pass-t">
  <title id="lc06-pass-t">한 패스: 타일별 히스토그램, 표 전체의 exclusive scan, 안정적 스캐터</title>
  <style>#lc06-pass{color:#1f2328}@media (prefers-color-scheme:dark){#lc06-pass{color:#e6edf3}}#lc06-pass text{fill:currentColor;stroke:none}</style>
  <defs>
    <marker id="lc06-pass-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" stroke="none"/></marker>
  </defs>
  <text x="20" y="52" font-weight="bold">입력 (src)</text>
  <text x="20" y="70" font-size="11">숫자 = 이번 패스의 자릿수</text>
  <rect x="170" y="36" width="54" height="34" rx="3" fill="currentColor" fill-opacity="0.4"/>
  <text x="197.0" y="58.0" text-anchor="middle">2a</text>
