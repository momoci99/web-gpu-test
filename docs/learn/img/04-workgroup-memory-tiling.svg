<svg xmlns="http://www.w3.org/2000/svg" id="lc04-tile" viewBox="0 0 620 420" width="620" height="420" font-family="sans-serif" font-size="13" fill="none" stroke="currentColor" stroke-width="1.5" role="img" aria-labelledby="lc04-tile-t">
  <title id="lc04-tile-t">타일링: C의 16×16 조각 하나를 A의 행 띠와 B의 열 띠에서 타일 단위로 계산</title>
  <style>#lc04-tile{color:#1f2328}@media (prefers-color-scheme:dark){#lc04-tile{color:#e6edf3}}#lc04-tile text{fill:currentColor;stroke:none}</style>
  <defs>
    <marker id="lc04-tile-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" stroke="none"/></marker>
  </defs>

  <!-- B: top, column strip -->
  <rect x="260" y="20" width="160" height="160"/>
  <rect x="320" y="20" width="32" height="160" fill="currentColor" fill-opacity="0.1" stroke-width="1"/>
  <g stroke-width="0.8" stroke-dasharray="3 3">
    <line x1="320" y1="52" x2="352" y2="52"/><line x1="320" y1="84" x2="352" y2="84"/>
    <line x1="320" y1="116" x2="352" y2="116"/><line x1="320" y1="148" x2="352" y2="148"/>
  </g>
  <rect x="320" y="52" width="32" height="32" fill="currentColor" fill-opacity="0.35" stroke-width="2"/>
  <text x="436" y="60" font-weight="bold">B</text>
  <text x="436" y="80" font-size="12">tileB: B의 t번째 타일</text>
  <text x="436" y="96" font-size="12">(k 16행 × 열 16개)</text>
  <line x1="432" y1="74" x2="356" y2="68" stroke-width="1" marker-end="url(#lc04-tile-a)"/>
  <line x1="372" y1="28" x2="372" y2="172" marker-end="url(#lc04-tile-a)"/>
  <text x="378" y="150" font-size="12">k</text>

  <!-- A: left, row strip -->
  <rect x="80" y="200" width="160" height="160"/>
  <rect x="80" y="250" width="160" height="32" fill="currentColor" fill-opacity="0.1" stroke-width="1"/>
  <g stroke-width="0.8" stroke-dasharray="3 3">
    <line x1="112" y1="250" x2="112" y2="282"/><line x1="144" y1="250" x2="144" y2="282"/>
    <line x1="176" y1="250" x2="176" y2="282"/><line x1="208" y1="250" x2="208" y2="282"/>
  </g>
  <rect x="112" y="250" width="32" height="32" fill="currentColor" fill-opacity="0.35" stroke-width="2"/>
  <text x="80" y="386" font-weight="bold">A</text>
  <text x="100" y="386" font-size="12">tileA: A의 t번째 타일 (행 16개 × k 16열)</text>
  <line x1="88" y1="300" x2="232" y2="300" marker-end="url(#lc04-tile-a)"/>
  <text x="200" y="318" font-size="12">k</text>

  <!-- C: bottom right -->
  <rect x="260" y="200" width="160" height="160"/>
  <rect x="320" y="250" width="32" height="32" fill="currentColor" fill-opacity="0.6" stroke-width="2"/>
  <text x="436" y="252" font-weight="bold">C = A × B</text>
  <text x="436" y="272" font-size="12">C의 16×16 조각 하나</text>
  <text x="436" y="288" font-size="12">= 워크그룹 하나</text>
  <text x="436" y="304" font-size="12">= 스레드 256개</text>
  <line x1="432" y1="276" x2="356" y2="268" stroke-width="1" marker-end="url(#lc04-tile-a)"/>

  <text x="20" y="410" font-size="12">t = 0, 1, 2, … 마다 타일 두 개를 공유 메모리에 올리고, 배리어, 곱셈-덧셈 16번, 배리어를 반복합니다.</text>
</svg>
